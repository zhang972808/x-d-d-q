<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>管理后台</title>
  <link rel="stylesheet" href="css/app.css?v=6"/>
  <link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico"/>
</head>
<body>
  <div class="bg-particles" id="particles"></div>
  <div class="app-container admin-page">

    <div class="app-header">
      <h1>📊 管理后台</h1>
      <div class="app-header-right">
        <span id="headerUser"></span>
        <button onclick="location.href='/index.html'" class="btn btn-sm">控制台</button>
        <button id="logoutBtn" class="btn btn-sm">退出</button>
      </div>
    </div>

    <!-- 统计 -->
    <div class="account-grid" style="margin-bottom:1.5rem">
      <div class="account-card">
        <div class="card-header"><span class="card-name">👥 用户总数</span></div>
        <div style="font-size:2rem;font-weight:700;color:var(--accent2)" id="statUsers">-</div>
      </div>
      <div class="account-card">
        <div class="card-header"><span class="card-name">🎮 游戏账号总数</span></div>
        <div style="font-size:2rem;font-weight:700;color:var(--accent2)" id="statAccounts">-</div>
      </div>
    </div>

    <!-- 用户列表 -->
    <div class="config-section">
      <h3>用户列表</h3>
      <table class="admin-table">
        <thead><tr>
          <th>ID</th><th>用户名</th><th>角色</th><th>配额</th><th>注册时间</th><th>操作</th>
        </tr></thead>
        <tbody id="userTableBody">
          <tr><td colspan="6" style="text-align:center;color:var(--text-muted)">加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 游戏账号总览 -->
    <div class="config-section" style="margin-top:1rem">
      <h3>所有游戏账号</h3>
      <table class="admin-table">
        <thead><tr>
          <th>ID</th><th>用户</th><th>昵称</th><th>游戏账号</th><th>游戏密码</th><th>服务器</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody id="subUserTableBody">
          <tr><td colspan="8" style="text-align:center;color:var(--text-muted)">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 编辑用户弹窗 -->
  <div id="editModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2>编辑用户</h2>
        <button class="modal-close" id="editClose">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editUserId"/>
        <div class="form-group"><label>用户名</label><input type="text" id="editUsername" disabled/></div>
        <div class="form-group"><label>角色</label><select id="editRole"><option value="user">普通用户</option><option value="admin">管理员</option></select></div>
        <div class="form-group"><label>游戏账号配额</label><input type="number" id="editQuota" min="0"/></div>
        <div class="form-group"><label>新密码</label><input type="password" id="editPassword" placeholder="不填则不修改，至少6位"/></div>
      </div>
      <div class="modal-footer">
        <button id="editCancel" class="btn">取消</button>
        <button id="editSave" class="btn btn-primary">保存</button>
        <button id="editDelete" class="btn btn-danger" style="margin-left:auto">删除用户</button>
      </div>
    </div>
  </div>

  <!-- 查看/编辑游戏账号配置弹窗 -->
  <div id="cfgModal" class="modal-overlay" style="display:none">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h2 id="cfgTitle">游戏账号配置</h2>
        <button class="modal-close" id="cfgClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-inline" style="margin-bottom:1rem">
          <div class="form-group"><label>昵称</label><input type="text" id="cfgNickname"/></div>
          <div class="form-group"><label>游戏账号</label><input type="text" id="cfgUsername"/></div>
          <div class="form-group"><label>游戏密码</label><input type="text" id="cfgPassword"/></div>
          <div class="form-group"><label>服务器ID</label><input type="text" id="cfgServerId"/></div>
          <div class="form-group"><label>平台</label><select id="cfgPlatform">
            <option value="qq">QQ</option><option value="app">APP</option><option value="douyin">抖音</option>
            <option value="vivo">Vivo</option><option value="oppo">OPPO</option><option value="xiaomi">小米</option>
            <option value="zfb">支付宝</option>
          </select></div>
        </div>
        <h4 style="color:var(--text-secondary);margin:1rem 0 0.5rem">完整配置 JSON</h4>
        <textarea id="cfgJson" style="width:100%;height:350px;background:rgba(0,0,0,0.3);color:var(--text-primary);border:1px solid var(--border-glass);border-radius:var(--radius);padding:0.75rem;font-family:'Consolas',monospace;font-size:0.8rem;resize:vertical"></textarea>
      </div>
      <div class="modal-footer">
        <button id="cfgCancel" class="btn">取消</button>
        <button id="cfgSave" class="btn btn-primary">💾 保存配置</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <div class="loading-overlay" id="overlay" style="display:none"><div class="spinner"></div></div>

  <script src="js/api.js?v=6"></script>
  <script>
(function () {
  if (!window.API || !window.API.isLoggedIn) { location.href = '/login.html'; return; }
  var user = window.API.getUser();
  if (!user || user.role !== 'admin') { location.href = '/index.html'; return; }

  function $(id) { return document.getElementById(id); }
  function toast(msg, type) {
    var c = $('toast-container'); if (!c) return;
    var el = document.createElement('div');
    el.className = 'toast toast-' + (type || 'info');
    el.textContent = msg; c.appendChild(el);
    setTimeout(function () { el.remove(); }, 3000);
  }
  function overlay(s) { var el = $('overlay'); if (el) el.style.display = s ? 'flex' : 'none'; }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s) { return String(s||'').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

  var allAccounts = [];

  async function loadAll() {
    overlay(true);
    try {
      var [usersRes, subsRes, statsRes] = await Promise.all([
        window.API.get('/api/admin/user/list'),
        window.API.get('/api/admin/sub-users'),
        window.API.get('/api/admin/stats')
      ]);
      allAccounts = subsRes.data || [];
      renderUsers(usersRes.data || []);
      renderSubUsers(allAccounts);
      if (statsRes.data) {
        $('statUsers').textContent = statsRes.data.userCount || 0;
        $('statAccounts').textContent = statsRes.data.totalAccounts || 0;
      }
    } catch (e) {
      toast('加载失败: ' + e.message, 'error');
    } finally {
      overlay(false);
    }
  }

  function renderUsers(users) {
    var tbody = $('userTableBody');
    if (!users.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">暂无</td></tr>';
      return;
    }
    tbody.innerHTML = users.map(function (u) {
      var badge = u.role === 'admin'
        ? '<span class="card-status status-running">管理员</span>'
        : '<span class="card-status status-stopped">普通</span>';
      return '<tr><td>' + u.id + '</td><td>' + esc(u.username) + '</td><td>' + badge +
        '</td><td>' + u.quota + '</td><td>' + (u.created_at||'').slice(0,10) +
        '</td><td><button class="btn btn-sm" onclick="editUser(' + u.id + ',\'' +
        escAttr(u.username) + '\',\'' + u.role + '\',' + u.quota + ')">编辑</button></td></tr>';
    }).join('');
  }

  function renderSubUsers(accounts) {
    var tbody = $('subUserTableBody');
    if (!accounts.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center">暂无</td></tr>';
      return;
    }
    tbody.innerHTML = accounts.map(function (a) {
      var sTag = a.status === 'running'
        ? '<span class="card-status status-running">运行中</span>'
        : '<span class="card-status status-stopped">已停止</span>';
      return '<tr><td>' + a.id + '</td><td>' + esc(a.owner) + '</td><td>' +
        esc(a.nickname||'-') + '</td><td>' + esc(a.game_username||'-') + '</td><td>' +
        '<span style="cursor:pointer" title="' + escAttr(a.game_password||'') + '">' +
        (a.game_password ? '••••' + a.game_password.slice(-2) : '-') + '</span></td><td>' +
        esc(a.server_id||'-') + '</td><td>' + sTag + '</td><td>' +
        '<button class="btn btn-sm" onclick="viewCfg(' + a.id + ')">配置</button></td></tr>';
    }).join('');
  }

  // ==================== 用户编辑 ====================
  window.editUser = function (id, username, role, quota) {
    $('editUserId').value = id;
    $('editUsername').value = username;
    $('editRole').value = role;
    $('editQuota').value = quota;
    $('editPassword').value = '';
    $('editModal').style.display = 'flex';
  };

  $('editClose').onclick = function () { $('editModal').style.display = 'none'; };
  $('editCancel').onclick = function () { $('editModal').style.display = 'none'; };

  $('editSave').onclick = async function () {
    var id = $('editUserId').value;
    overlay(true);
    try {
      var r = await window.API.put('/api/admin/user/' + id, {
        role: $('editRole').value,
        quota: parseInt($('editQuota').value) || 0
      });
      if (r.code !== 200) { toast(r.msg, 'error'); return; }

      var pw = $('editPassword').value.trim();
      if (pw) {
        r = await window.API.put('/api/admin/user/' + id + '/password', { password: pw });
        if (r.code !== 200) { toast('密码: ' + r.msg, 'error'); return; }
      }
      toast('保存成功', 'success');
      $('editModal').style.display = 'none';
      loadAll();
    } catch (e) {
      toast('失败: ' + e.message, 'error');
    } finally {
      overlay(false);
    }
  };

  $('editDelete').onclick = async function () {
    if (!confirm('确定删除该用户及其所有游戏账号？不可恢复！')) return;
    overlay(true);
    try {
      var r = await window.API.del('/api/admin/user/' + $('editUserId').value);
      if (r.code === 200) {
        toast('已删除', 'success');
        $('editModal').style.display = 'none';
        loadAll();
      } else {
        toast(r.msg, 'error');
      }
    } catch (e) {
      toast('失败: ' + e.message, 'error');
    } finally {
      overlay(false);
    }
  };

  // ==================== 游戏账号配置查看/编辑 ====================
  window.viewCfg = function (id) {
    var a = allAccounts.find(function (x) { return x.id === id; });
    if (!a) { toast('找不到账号', 'error'); return; }
    $('cfgTitle').textContent = '配置 - ' + (a.nickname || '未命名') + ' (所属: ' + (a.owner || '-') + ')';
    $('cfgNickname').value = a.nickname || '';
    $('cfgUsername').value = a.game_username || '';
    $('cfgPassword').value = a.game_password || '';
    $('cfgServerId').value = a.server_id || '';
    $('cfgPlatform').value = a.platform || 'qq';

    // 解析 config JSON 并格式化显示
    var cfg = {};
    try { cfg = typeof a.config === 'string' ? JSON.parse(a.config) : (a.config || {}); } catch (e) {}
    $('cfgJson').value = JSON.stringify(cfg, null, 2);
    $('cfgJson').dataset.accountId = id;
    $('cfgModal').style.display = 'flex';
  };

  $('cfgClose').onclick = function () { $('cfgModal').style.display = 'none'; };
  $('cfgCancel').onclick = function () { $('cfgModal').style.display = 'none'; };

  $('cfgSave').onclick = async function () {
    var id = $('cfgJson').dataset.accountId;
    var cfgStr = $('cfgJson').value.trim();
    var cfg;
    try { cfg = JSON.parse(cfgStr); }
    catch (e) { toast('JSON 格式错误: ' + e.message, 'error'); return; }

    overlay(true);
    try {
      // 保存基础信息
      var r = await window.API.put('/api/sub-user/' + id, {
        nickname: $('cfgNickname').value.trim(),
        game_username: $('cfgUsername').value.trim(),
        game_password: $('cfgPassword').value.trim(),
        server_id: $('cfgServerId').value.trim(),
        platform: $('cfgPlatform').value,
      });
      if (r.code !== 200) { toast(r.msg, 'error'); return; }

      // 保存完整配置
      r = await window.API.put('/api/sub-user/' + id + '/setting', cfg);
      if (r.code !== 200) { toast(r.msg, 'error'); return; }

      toast('配置已保存', 'success');
      $('cfgModal').style.display = 'none';
      loadAll();
    } catch (e) {
      toast('失败: ' + e.message, 'error');
    } finally {
      overlay(false);
    }
  };

  // ==================== 头部 ====================
  $('headerUser').textContent = user ? '👤 ' + user.username + ' (管理员)' : '';
  $('logoutBtn').onclick = function () { window.API.clearToken(); window.API.clearUser(); location.href = '/login.html'; };

  // 粒子
  (function(){var c=$('particles');if(c)for(var i=0;i<25;i++){var p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.width=p.style.height=(Math.random()*3+1)+'px';p.style.animationDuration=(Math.random()*20+12)+'s';p.style.animationDelay=Math.random()*12+'s';c.appendChild(p)}})();

  loadAll();
})();
  </script>
</body>
</html>
