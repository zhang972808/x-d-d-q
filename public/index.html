<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>控制台</title>
  <link rel="stylesheet" href="css/app.css?v=3"/>
  <link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico"/>
</head>
<body>
  <div class="bg-particles" id="particles"></div>

  <div class="app-container">
    <!-- Header -->
    <div class="app-header">
      <h1>🎮 游戏控制台</h1>
      <div class="app-header-right">
        <span id="headerUser"></span>
        <button id="adminBtn" class="btn btn-sm" style="display:none">管理</button>
        <button id="logoutBtn" class="btn btn-sm">退出</button>
      </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <button id="addAccountBtn" class="btn btn-primary">+ 添加账号</button>
      <span id="quotaInfo" class="quota-badge"></span>
    </div>

    <!-- 账号列表 -->
    <div id="accountList" class="account-grid">
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>还没有游戏账号</p>
        <p style="font-size:0.8rem;margin-top:0.25rem">点击 "+ 添加账号" 开始</p>
      </div>
    </div>
  </div>

  <!-- 添加/编辑账号弹窗 -->
  <div id="accountModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">添加游戏账号</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>昵称</label>
          <input type="text" id="accNickname" placeholder="给账号起个名字"/>
        </div>
        <div class="form-group">
          <label>平台</label>
          <select id="accPlatform">
            <option value="qq">QQ / 微信小程序</option>
            <option value="app">APP</option>
            <option value="douyin">抖音</option>
            <option value="vivo">Vivo</option>
            <option value="oppo">OPPO</option>
            <option value="xiaomi">小米</option>
            <option value="zfb">支付宝</option>
          </select>
        </div>
        <div class="form-group">
          <label>游戏账号</label>
          <input type="text" id="accUsername" placeholder="游戏登录账号"/>
        </div>
        <div class="form-group">
          <label>游戏密码</label>
          <input type="password" id="accPassword" placeholder="游戏登录密码"/>
        </div>
        <div class="form-group">
          <label>服务器</label>
          <div style="display:flex;gap:8px">
            <select id="accServer" style="flex:1">
              <option value="">-- 先获取服务器列表 --</option>
            </select>
            <button id="fetchServersBtn" class="btn btn-sm">获取服务器</button>
          </div>
        </div>
        <input type="hidden" id="accId"/>
      </div>
      <div class="modal-footer">
        <button id="modalCancel" class="btn">取消</button>
        <button id="modalSave" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 日志弹窗 -->
  <div id="logModal" class="modal-overlay" style="display:none">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h2 id="logTitle">运行日志</h2>
        <button class="modal-close" id="logClose">&times;</button>
      </div>
      <div class="modal-body">
        <pre id="logContent" class="log-viewer">加载中...</pre>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <div class="loading-overlay" id="overlay" style="display:none"><div class="spinner"></div></div>

  <script src="js/api.js?v=3"></script>
  <script src="js/dashboard.js?v=3"></script>

  <script>
    (function(){
      var container = document.getElementById('particles');
      if (!container) return;
      for (var i = 0; i < 30; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
        p.style.animationDuration = (Math.random() * 20 + 12) + 's';
        p.style.animationDelay = Math.random() * 12 + 's';
        container.appendChild(p);
      }
    })();
  </script>
</body>
</html>
