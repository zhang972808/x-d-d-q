<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>登录 — 控制台</title>
  <link rel="stylesheet" href="css/app.css?v=3"/>
  <link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico"/>
  <style>
    /* 登录页特有覆盖 */
    body { background: var(--bg-secondary); }
    .login-visual .floating-cards { position: absolute; width: 100%; height: 100%; }
    .login-visual .float-card {
      position: absolute; border-radius: 16px; padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px); font-size: 0.8rem; color: var(--text-secondary);
      animation: floatCard 6s ease-in-out infinite;
    }
    .login-visual .float-card:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
    .login-visual .float-card:nth-child(2) { top: 30%; right: 15%; animation-delay: -2s; }
    .login-visual .float-card:nth-child(3) { bottom: 25%; left: 20%; animation-delay: -4s; }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .login-visual .glow-orb {
      position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.3;
      animation: orbPulse 4s ease-in-out infinite;
    }
    .login-visual .glow-orb:nth-child(4) {
      width: 200px; height: 200px; background: var(--accent);
      top: 20%; left: 30%; animation-delay: 0s;
    }
    .login-visual .glow-orb:nth-child(5) {
      width: 150px; height: 150px; background: var(--info);
      bottom: 30%; right: 25%; animation-delay: -2s;
    }
    @keyframes orbPulse {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.3); opacity: 0.45; }
    }
  </style>
</head>
<body>
  <div class="bg-particles" id="particles"></div>

  <div class="login-page">
    <!-- 左侧视觉区 -->
    <div class="login-visual">
      <div class="glow-orb"></div>
      <div class="glow-orb"></div>
      <div class="floating-cards">
        <div class="float-card">🎮 游戏托管  ·  解放双手</div>
        <div class="float-card">⚡ 自动砍树  ·  自动福地</div>
        <div class="float-card">📊 实时日志  ·  随时掌控</div>
      </div>
      <div class="login-visual-content">
        <div class="icon" style="font-size:3rem;line-height:120px">🎯</div>
        <h2>游戏托管平台</h2>
        <p>多账号管理 · 自动脚本运行<br/>实时监控 · 便捷配置</p>
      </div>
    </div>

    <!-- 右侧登录表单 -->
    <div class="login-form-side">
      <div class="login-card">
        <h1>登 录</h1>
        <p class="subtitle">醉后不知天在水，满船清梦压星河</p>

        <div class="tabs" id="authTabs" style="justify-content:center">
          <button type="button" class="tab active" data-tab="login">登录</button>
          <button type="button" class="tab" data-tab="register">注册</button>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="loginUsername" autocomplete="username" placeholder="请输入用户名" required/>
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="loginPassword" autocomplete="current-password" placeholder="请输入密码" required/>
          </div>
          <button type="submit" id="loginBtn" class="btn btn-primary btn-block">🚀 登 录</button>
        </form>

        <form id="registerForm" style="display:none">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="regUsername" placeholder="至少3个字符" required minlength="3"/>
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="regPassword" placeholder="至少6个字符" required minlength="6"/>
          </div>
          <div class="form-group">
            <label>确认密码</label>
            <input type="password" id="regConfirm" placeholder="再次输入密码" required/>
          </div>
          <button type="submit" id="registerBtn" class="btn btn-primary btn-block">📝 注 册</button>
        </form>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <div class="loading-overlay" id="overlay" style="display:none"><div class="spinner"></div></div>

  <script src="js/api.js?v=3"></script>
  <script src="js/login.js?v=3"></script>

  <script>
    // 粒子背景
    (function(){
      var container = document.getElementById('particles');
      for (var i = 0; i < 40; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = p.style.height = (Math.random() * 4 + 2) + 'px';
        p.style.animationDuration = (Math.random() * 15 + 10) + 's';
        p.style.animationDelay = Math.random() * 10 + 's';
        container.appendChild(p);
      }
    })();
  </script>
</body>
</html>
